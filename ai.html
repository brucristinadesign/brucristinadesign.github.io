<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IA Studio · Bruna Cristina</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  :root {
    --navy: #1C1B4B;
    --cream: #FAF8F2;
    --yellow: #FCD067;
    --coral: #F4906E;
    --orange-dk: #EE592F;
    --skyblue: #AFD6D5;
    --mint: #4CEAA8;
    --pink: #FFB7C8;
    --ink: #000000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--pink); color: var(--navy); overflow-x: hidden; min-height: 100vh; }
  body { font-family: var(--font-ui); font-weight: 300; }
  a { color: inherit; text-decoration: none; }

  .nav-wrap { position: sticky; top: 0; z-index: 50; padding: 18px clamp(16px,4vw,56px) 0; background: linear-gradient(to bottom, var(--pink) 70%, transparent); }
  .nav { max-width: 1320px; margin: 0 auto; display: flex; align-items: flex-end; gap: 6px; }
  .nav-tabs { display: flex; align-items: flex-end; flex: 1; gap: 4px; }
  .tab { padding: 10px 22px 12px; font-weight: 500; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; border: 1.5px solid var(--navy); border-bottom: none; border-radius: 18px 18px 0 0; background: var(--cream); transition: transform .16s; color: var(--navy); }
  .tab:hover { transform: translateY(-2px); }
  .tab.is-active { background: var(--pink); color: var(--navy); border-color: var(--navy); }
  .tab[data-c="yellow"] { background: var(--yellow); }
  .tab[data-c="mint"] { background: var(--mint); }
  .tab[data-c="sky"] { background: var(--skyblue); }
  .nav-signature { background: var(--cream); border: 1.5px solid var(--navy); border-radius: 999px; padding: 6px 18px; font-family: var(--font-display); font-style: italic; font-size: 16px; align-self: flex-end; }
  .nav-rule { max-width: 1320px; margin: 0 auto; border-top: 1.5px solid var(--navy); }

  .page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 80px); padding: clamp(60px,10vw,140px) clamp(20px,5vw,80px); text-align: center; }

  .badge { display: inline-flex; align-items: center; gap: 8px; background: var(--navy); color: var(--pink); border: 1.5px solid var(--navy); border-radius: 999px; padding: 8px 22px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; margin-bottom: 40px; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(72px,14vw,220px); line-height: .88; letter-spacing: -.05em; color: var(--navy); margin: 0 0 24px; }
  h1 em { font-style: italic; }

  .sub { font-size: clamp(16px,2vw,22px); line-height: 1.6; color: var(--navy); opacity: .75; max-width: 540px; margin: 0 auto 48px; }

  .back-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--navy); color: var(--cream); border: 1.5px solid var(--navy); border-radius: 999px; padding: 14px 28px; font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; transition: all .2s; }
  .back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(28,27,75,.22); }

  @media (max-width: 540px) {
    .nav-wrap { padding: 8px 0 0; }
    .nav { padding: 0 8px; }
    .nav-tabs { flex-wrap: nowrap; gap: 2px; justify-content: stretch; }
    .tab { padding: 6px 8px 8px; font-size: 9px; letter-spacing: .04em; border-radius: 10px 10px 0 0; white-space: nowrap; flex: 1; text-align: center; }
    .nav-signature { display: none; }
  }
</style>
<script async type='text/javascript' src='https://static.klaviyo.com/onsite/js/YxFfpH/klaviyo.js?company_id=YxFfpH'></script>
</head>
<body>

<div class="nav-wrap">
  <nav class="nav">
    <div class="nav-tabs">
      <a href="index.html" class="tab">início</a>
      <a href="index.html#servicos" class="tab">serviços</a>
      <a href="index.html#ads" class="tab" data-c="yellow">ads</a>
      <a href="index.html#branding" class="tab" data-c="mint">branding</a>
      <a href="ai.html" class="tab is-active">ia studio ✦</a>
      <a href="index.html#contato" class="tab" data-c="sky">contato</a>
    </div>
    <span class="nav-signature">Bruna Cristina</span>
  </nav>
  <div class="nav-rule"></div>
</div>

<div class="page">
  <div class="badge"><span class="dot"></span>em breve</div>
  <h1>ia <em>studio</em> ✦</h1>
  <p class="sub">criação de imagens com inteligência artificial e direção criativa do início ao fim. em construção — novidades chegando em breve.</p>
  <a href="index.html" class="back-btn">← voltar ao portfólio</a>
</div>

</body>
</html>
