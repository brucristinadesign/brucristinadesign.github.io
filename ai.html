<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ai studio · em breve · Bruna Cristina</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  :root {
    --navy: #1C1B4B;
    --cream: #FAF8F2;
    --pink: #F8B7C8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--pink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Neue Haas Grotesk', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    padding: 40px 24px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--navy);
    opacity: .6;
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(48px, 10vw, 96px);
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
    margin-bottom: 20px;
  }
  h1 em { font-style: italic; font-weight: 400; }
  p {
    font-size: 16px;
    color: var(--navy);
    opacity: .7;
    max-width: 380px;
    line-height: 1.6;
    margin-bottom: 40px;
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid var(--navy);
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--navy);
    text-decoration: none;
    transition: background .2s, color .2s;
  }
  .back:hover { background: var(--navy); color: var(--pink); }
</style>
</head>
<body>
  <p class="eyebrow">— ai studio</p>
  <h1>em <em>breve</em></h1>
  <p>essa página está sendo construída com carinho. em breve você vai poder ver tudo por aqui.</p>
  <a href="index.html" class="back">← voltar ao portfólio</a>
</body>
</html>
